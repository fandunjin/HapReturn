name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: hapreturn --version
      - run: hapreturn --final-fasta examples/final.fa --hap1-paf examples/hap1.paf --hap2-paf examples/hap2.paf --chromosome-list examples/chromosomes.txt --homolog-groups examples/groups.tsv --ploidy 4 --hap1-per-group 2 --min-aln-len 1 --out-dir example_output
