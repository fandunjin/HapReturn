[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hapreturn"
version = "0.5.0"
description = "Return a merged 2n assembly to two n source sets using hap1/hap2 provenance"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HapReturn contributors"}]
keywords = ["genomics", "hifiasm", "HapHiC", "haplotype", "polyploid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["matplotlib>=3.6,<4"]

[project.scripts]
hapreturn = "hapreturn.cli:main"
hapreturn-chromosomes = "hapreturn.comparison:main"
hapreturn-report = "hapreturn.report:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hapreturn*"]
