[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hapreturn"
version = "0.2.0"
description = "Recover source-labelled chromosome sets from merged polyploid assemblies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HapReturn contributors"}]
keywords = ["genomics", "hifiasm", "HapHiC", "haplotype", "polyploid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.scripts]
hapreturn = "hapreturn.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hapreturn*"]
